<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Mobilność i bark: po grze rakieta leży obok prawej stopy. Zawodniczka swobodnie prowadzi ramię uderzające w poprzek klatki piersiowej na drugą stronę; wolna ręka chwyta je tuż nad łokciem i delikatnie przyciąga. Barki pozostają nisko, tułów się nie obraca. Łagodny półksiężyc z tyłu prawego barku pokazuje, gdzie może lekko ciągnąć.">

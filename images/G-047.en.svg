<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Talking it through: two doubles partners in their own court before the serve, facing each other. On the left the rear-court player behind the service line; about to serve, holding the Speeder in the free hand and saying the essentials in one sentence. On the right the attacking player, feet already pointing forward, nods and raises an open hand. A dashed arrow shows the way forward.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Talking it through: two doubles partners in their own court before the serve, facing each other. On the left, behind the service line, the rear-court player, who serves next, holds the Speeder in the free hand and says the essentials in one sentence. On the right the attacking player, feet already pointing forward, nods and gives a thumbs-up. A dashed arrow shows the attacking player's path to the front.">

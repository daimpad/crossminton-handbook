<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Le smash : le même joueur que pour le dégagement, mais le point de frappe est plus en avant, devant la tête au-dessus de l'épaule avant. La surface de frappe est fermée, le haut du corps bascule vers l'avant, le poids est sur la jambe avant. La trajectoire part longue, vers l'avant et le bas, dans le terrain adverse ; deux lignes fines à côté montrent d'autres angles.">

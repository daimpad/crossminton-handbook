<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Funplay: zwei Spielende stehen sich auf mittlerer Distanz gegenüber, ohne Court. Links trifft eine Spielerin den Speeder mit einem ruhigen Vorhand-Drive, rechts wartet ihre Partnerin in Bereitschaft. Die Bahn läuft flach hin und gestrichelt zurück, eine Strichliste zählt die Kontakte am Stück.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Zwód, obraz 2: ten sam gracz, za nim w obrysie pozycja zamachu z obrazu 1. W chwili uderzenia biodra i barki obracają się do celu, ciężar ciała przechodzi do przodu, powierzchnia rakiety pozostaje neutralna. Dopiero przy speederze rozchodzą się dwie drogi: mocne uderzenie jako wyraźna linia, płasko i daleko poza obraz, oraz skrót jako linia kropkowana w tym samym kierunku, która wcześnie traci wysokość i opada dopiero daleko z przodu. Okrąg zaznacza moment decyzji.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Długość i głębia: zagrać krótką piłkę na przednią linię lub głęboką piłkę na linię końcową.">
  <style>
    .linie{fill:none;stroke:var(--tinte,#16202b);stroke-width:2.4}
    .ziel{fill:var(--primaer,#38a4f1);opacity:.13}
    .traj{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:2.6}
    .marker{fill:var(--primaer,#38a4f1)}
    .zonetext{fill:var(--primaer-tief,#1568ad);font:700 12px/1 system-ui,'Segoe UI',sans-serif;letter-spacing:.5px;text-anchor:middle;paint-order:stroke;stroke:var(--primaer-weich,#e8f3fe);stroke-width:5;stroke-linejoin:round}
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" class="marker"/></marker></defs>

  <rect class="ziel" x="52" y="42"  width="196" height="42"/>
  <rect class="ziel" x="52" y="196" width="196" height="42"/>
  <rect class="linie" x="52" y="42" width="196" height="196"/>

  <path class="traj" d="M150,288 C 132,262 120,252 116,229" marker-end="url(#ah)"/>
  <path class="traj" d="M150,288 C 176,215 190,130 186,80" marker-end="url(#ah)"/>
  <circle class="marker" cx="116" cy="229" r="5.5"/>
  <circle class="marker" cx="186" cy="76"  r="5.5"/>

  <text class="zonetext" x="150" y="60">głęboko — na linię końcową</text>
  <text class="zonetext" x="150" y="211">krótko — na linię przednią</text>
</svg>

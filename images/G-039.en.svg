<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Defending as a pair: both stand deeper and wider, one in front, one behind — each covers their area.">
  <style>
    .linie{fill:none;stroke:var(--tinte,#16202b);stroke-width:2.4}
    .spieler{fill:var(--primaer,#38a4f1)}
    .teiler{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:1.8;stroke-dasharray:7 5}
    .haelfte{fill:var(--primaer,#38a4f1);opacity:.06}
    .zonetext{fill:var(--primaer-tief,#1568ad);font:700 12px/1 system-ui,'Segoe UI',sans-serif;text-anchor:middle}
    .subtext{fill:var(--tinte-3,#6b7686);font:600 12px/1 system-ui,'Segoe UI',sans-serif;text-anchor:middle}
  </style>
  <!-- Frontlinie oben. Beide tiefer und breiter; vorne der Angriffsspieler, hinten der Rueckraumspieler, jeder deckt seinen Bereich. -->
  <rect class="haelfte" x="52" y="42" width="196" height="98"/>
  <rect class="linie" x="52" y="42" width="196" height="196"/>
  <line class="teiler" x1="52" y1="140" x2="248" y2="140"/>
  <circle class="spieler" cx="112" cy="110" r="11"/>
  <circle class="spieler" cx="188" cy="186" r="11"/>
  <text class="subtext" x="192" y="96">front</text>
  <text class="subtext" x="108" y="206">back</text>
  <text class="zonetext" x="150" y="272">defense: deeper and wider</text>
</svg>

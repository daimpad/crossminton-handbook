<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Jouer dehors : vue légèrement en hauteur, derrière un joueur, dans l'axe du jeu. Deux terrains sans filet, séparés par la longue zone neutre. Le joueur du terrain proche regarde un drapeau qui flotte au vent sur un mât, derrière le terrain éloigné où se tient l'adversaire. Dans le ciel, le soleil et des lignes de vent ; à l'horizon, des arbres.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Siła reaktywna, krótki kontakt z podłożem: zbliżenie nogi z boku w najniższym punkcie kontaktu. Kolano jest lekko ugięte, but dotyka podłoża tylko przodostopiem, pięta unosi się tuż nad nim. Ścięgno Achillesa narysowano jako sprężynę. W obrysie stopa nadlatuje z góry z lewej i odrywa się od podłoża w górę w prawo; obie strzałki tworzą wąskie V.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Siła reaktywna, krótki kontakt z podłożem: zbliżenie nogi z boku w najniższym punkcie kontaktu. Kolano jest lekko ugięte, but dotyka podłoża tylko przodostopiem, pięta unosi się tuż nad nim. Ścięgno Achillesa narysowano jako sprężynę. W zarysie stopa nadlatuje z góry z lewej, z palcami skierowanymi w dół, i odrywa się od podłoża w górę w prawo, po odbiciu jeszcze mocniej wyprostowana; obie strzałki tworzą wąskie V.">

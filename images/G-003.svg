<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Der Vorhand-Drive im Treffmoment: linker Fuß vorn, das Gewicht auf dem vorderen Fuß, der Oberkörper zum Ziel gedreht. Der Schläger kommt in einem kurzen, flachen Bogen auf Hüfthöhe nach vorn und trifft den Speeder vor dem Körper; der fliegt flach und direkt weg.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Le revers de l'adversaire : jouer le speeder de façon ciblée dans le coin revers de l'adversaire.">
  <style>
    .linie{fill:none;stroke:var(--tinte,#16202b);stroke-width:2.4}
    .ziel{fill:var(--primaer,#38a4f1);opacity:.14}
    .s-ring{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:2.2}
    .traj{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:2.6}
    .marker{fill:var(--primaer,#38a4f1)}
    .gegner{fill:var(--tinte-3,#656f7e)}
    .zonetext{fill:var(--primaer-tief,#1568ad);font:700 11px/1 system-ui,'Segoe UI',sans-serif;text-anchor:middle}
    .subtext{fill:var(--tinte-3,#656f7e);font:600 11px/1 system-ui,'Segoe UI',sans-serif;text-anchor:middle}
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="6.5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" class="marker"/></marker></defs>

  <rect class="linie" x="52" y="42" width="196" height="196"/>
  <circle class="ziel" cx="90" cy="80" r="34"/>
  <circle class="s-ring" cx="90" cy="80" r="34"/>

  <!-- Gegner steht leicht zur Vorhand, die Rückhand-Ecke bleibt offen -->
  <circle class="gegner" cx="176" cy="150" r="9"/>
  <text class="subtext" x="176" y="176">adversaire</text>

  <path class="traj" d="M150,286 C 120,240 97,153 90,116" marker-end="url(#ah)"/>
  <text class="zonetext" x="90" y="84">revers</text>
</svg>

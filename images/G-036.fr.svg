  <path class="glatt" d="M46,222 C 70,214 96,214 118,222" marker-end="url(#m036)"/>
  <!-- Trennlinie -->
  <line class="trenn" x1="150" y1="60" x2="150" y2="214"/>
  <!-- hektisch (rechts, blass) -->
  <circle class="kopfh" cx="220" cy="86" r="12"/>
  <path class="figh" d="M220,98 L224,146"/>
  <path class="figh" d="M221,110 L202,122"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Économie de mouvement : à gauche un joueur qui se déplace efficacement — un trajet lisse et court ; à droite, pâle, une version agitée avec de nombreuses lignes de mouvement supplémentaires éparpillées.">
  <style>
    .fig{fill:none;stroke:var(--tinte,#16202b);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
    .kopf{fill:var(--tinte,#16202b)}
    .figh{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
    .kopfh{fill:var(--tinte-3,#6b7686);opacity:.45}
    .glatt{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:3.4;stroke-linecap:round}
    .hektik{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.6;stroke-linecap:round;opacity:.6}
    .trenn{fill:none;stroke:var(--linie,#e2e8ee);stroke-width:2;stroke-dasharray:4 6}
    .boden{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.4;stroke-dasharray:5 6}
    .mk{fill:var(--primaer,#38a4f1)}
    .st{fill:var(--tinte-3,#6b7686);font:600 12px/1 system-ui,sans-serif;text-anchor:middle}
  </style>
  <defs><marker id="m036" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="6.5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" class="mk"/></marker></defs>

  <path class="hektik" d="M186,120 L200,112"/>
  <path class="hektik" d="M250,116 L266,110"/>
  <path class="hektik" d="M184,160 L198,168"/>
  <path class="hektik" d="M252,164 L268,158"/>
  <path class="hektik" d="M200,196 L188,206"/>
  <path class="hektik" d="M248,198 L262,208"/>
  <line class="boden" x1="40" y1="222" x2="124" y2="222"/>
  <line class="boden" x1="182" y1="222" x2="266" y2="222"/>
  <text class="st" x="150" y="256">efficace plutôt qu'agité</text>
</svg>

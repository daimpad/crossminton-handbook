<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Sun and glare: a player in a cap with a brim prepares an overhead shot. The sun is on the right, and three rays reach from it to just in front of the eyes. The Speeder's flight path comes from the right, runs straight through the sun and is only faint there; after that the Speeder is clearly drawn again. The player has turned the head and looks past the rays to the Speeder.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Funplay: two players face each other at medium distance, without a court. On the left, a player meets the Speeder with a calm forehand drive; on the right, her partner waits in the ready position. The trajectory runs flat across and, dashed, back again; a tally counts the contacts in a row.">

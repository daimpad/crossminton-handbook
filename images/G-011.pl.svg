<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Smecz: wysoki punkt kontaktu nad i przed głową, agresywne uderzenie w dół, tor lotu prowadzi stromo i prosto w pole przeciwnika.">
  <style>
    .fig{fill:none;stroke:var(--tinte,#16202b);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
    .kopf{fill:var(--tinte,#16202b)}
    .schaft{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5;stroke-linecap:round}
    .kelle{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5}
    .bahn{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:3.4;stroke-dasharray:2 7;stroke-linecap:round}
    .boden{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.6;stroke-dasharray:5 6}
    .mk{fill:var(--primaer,#38a4f1)}
    .st{fill:var(--tinte-3,#6b7686);font:600 12px/1 system-ui,sans-serif;text-anchor:middle}
  </style>
  <defs><marker id="m011" viewBox="0 0 10 10" markerWidth="7.5" markerHeight="7.5" refX="6.5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" class="mk"/></marker></defs>
  <circle class="kopf" cx="100" cy="100" r="14"/>
  <path class="fig" d="M100,114 L110,174"/>
  <!-- Schlagarm hoch, Treffpunkt über/vor dem Kopf -->
  <path class="fig" d="M101,122 L124,92 L146,66"/>
  <!-- freier Arm -->
  <path class="fig" d="M103,128 L84,150"/>
  <!-- Beine, Körper treibt nach vorn -->
  <path class="fig" d="M110,174 L94,208 L84,240"/>
  <path class="fig" d="M110,174 L134,204 L150,236"/>
  <!-- Schläger am hohen Treffpunkt -->
  <line class="schaft" x1="146" y1="66" x2="160" y2="52"/>
  <ellipse class="kelle" cx="166" cy="44" rx="10" ry="14" transform="rotate(44 166 44)"/>
  <!-- steile, gerade Flugbahn nach unten -->
  <path class="bahn" d="M172,52 L252,204" marker-end="url(#m011)"/>
  <line class="boden" x1="72" y1="244" x2="190" y2="244"/>
  <text class="st" x="150" y="272">wysoki kontakt · stromo w dół</text>
</svg>

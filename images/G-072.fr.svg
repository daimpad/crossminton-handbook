<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Attaque et défense selon la hauteur de frappe : un joueur est en position de base, devant lui trois bandes de hauteur. Au-dessus de la tête, c'est l'attaque : frappé là, le speeder part de haut en bas, en descente raide. Sous les hanches, c'est la défense : là, il faut jouer le speeder vers le haut pour maintenir l'échange en vie. Entre les deux se trouve la zone où le rôle bascule.">

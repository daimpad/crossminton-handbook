<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Beinarbeit, Bild 1: der Split-Step — ein kleiner federnder Hüpfer, Landung auf den Ballen beider Füße, Knie gebeugt, bereit zum Abdruck in jede Richtung.">
  <style>
    .fig{fill:none;stroke:var(--tinte,#16202b);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
    .kopf{fill:var(--tinte,#16202b)}
    .schaft{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5;stroke-linecap:round}
    .kelle{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5}
    .hopf{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:3;stroke-linecap:round}
    .boden{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.6;stroke-dasharray:5 6}
    .st{fill:var(--tinte-3,#6b7686);font:600 12px/1 system-ui,sans-serif;text-anchor:middle}
  </style>
  <defs><marker id="m007" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="var(--primaer,#38a4f1)"/></marker></defs>
  <!-- kleiner Hüpfer: Aufwärtspfeil -->
  <path class="hopf" d="M150,48 L150,30" marker-end="url(#m007)"/>
  <circle class="kopf" cx="150" cy="72" r="15"/>
  <path class="fig" d="M150,96 L150,158"/>
  <path class="fig" d="M150,112 L124,122 L138,150"/>
  <path class="fig" d="M150,112 L176,122 L162,150"/>
  <!-- Beine gebeugt, Füße schulterbreit, auf den Ballen -->
  <path class="fig" d="M150,158 L122,190 L118,220"/>
  <path class="fig" d="M150,158 L178,190 L182,220"/>
  <line class="schaft" x1="150" y1="150" x2="150" y2="180"/>
  <ellipse class="kelle" cx="150" cy="196" rx="11" ry="15"/>
  <!-- kurze Feder-Linien unter den Füßen -->
  <path class="hopf" d="M104,232 L128,232"/>
  <path class="hopf" d="M172,232 L196,232"/>
  <line class="boden" x1="98" y1="244" x2="202" y2="244"/>
  <text class="st" x="150" y="270">kleiner federnder Hüpfer · auf die Ballen</text>
</svg>

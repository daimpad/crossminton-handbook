<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="The short warm-up sequence in three steps side by side. First, easy jogging until the body gets slightly warm. Second, dynamic preparation, here a loose forward lunge. Third, game-like, a shadow stroke with the racket but without a Speeder. Warming up should get you ready, not tired.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Der Smash: derselbe Spieler wie beim Überkopf-Clear, aber der Treffpunkt liegt weiter vorn, vor dem Kopf über der vorderen Schulter. Die Schlagfläche ist geschlossen, der Oberkörper klappt nach vorn, das Gewicht liegt auf dem vorderen Bein. Die Flugbahn führt lang nach vorn unten ins gegnerische Feld, zwei dünne Linien daneben zeigen andere Winkel.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Tempowechsel, Bild 2: der gebrochene Takt. Dieselbe schnelle Bewegung wie in Bild 1, doch im Treffpunkt nimmt der Spieler das Tempo heraus: die Hand bleibt stehen, die Fläche öffnet nach oben, der Speeder steigt hoch und weich. In der Leiste darunter folgt auf drei schnelle Schläge eine Lücke.">

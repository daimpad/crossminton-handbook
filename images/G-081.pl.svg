<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Trzy kafelki obok siebie: Snowminton z płatkiem śniegu nad zaśnieżonym podłożem, Beachminton ze słońcem nad wydmami, Blackminton z torem punktów świetlnych w ciemności. Klamra nad wszystkimi trzema mówi: te same zasady. Zmienia się tylko otoczenie, czyli podłoże, temperatura albo światło.">
  <style>
    .s-pfeil{fill:var(--tinte-3,#656f7e)}
    .s-apfeil{fill:var(--primaer-dunkel,#1e8bd6)}

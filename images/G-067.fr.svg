<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Vue de dessus dans l'ouverture de la jupe d'un speeder : seize nervures longitudinales espacées de 22,5 degrés, le bord d'ouverture ondulé et la tête située derrière.">

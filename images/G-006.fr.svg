<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Service, image 2 : la même vue au moment de la frappe. Le poids est passé sur le pied avant, le talon arrière se lève, l'avant du pied reste au sol. Le bras de frappe est venu de l'arrière, par en dessous, vers l'avant ; la raquette pend presque à la verticale, la tête juste devant et sous la main, la face légèrement ouverte vers l'avant. Tout le speeder est sous la ligne en tirets à hauteur de la main de frappe ; la trajectoire monte, plate et longue, hors de l'image.">

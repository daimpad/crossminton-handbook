<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Aufschlag, Bild 1: seitlich gesehen, das Gewicht auf dem hinteren Fuß. Die freie Hand hat den Speeder auf Hüfthöhe vor dem Körper eben losgelassen, er fällt mit der Kappe nach unten. Der Schlagarm hängt locker nach hinten unten ausgeholt, der Schläger hinter dem Bein. Ein Bogenpfeil zeigt den kommenden Schwung von unten nach vorn; beide Füße stehen hinter der Aufschlaglinie.">

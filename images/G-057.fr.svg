<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Humidité et appui sûr : un joueur fait un pas court et contrôlé sur un sol mouillé, les genoux légèrement fléchis, la raquette devant le corps. Sous le sol, des flèches montrent l'enchaînement : deux pas tout aussi courts avant celui-ci. Devant lui, une flaque où il ne pose pas le pied. Il pleut légèrement, la semelle a des crampons.">

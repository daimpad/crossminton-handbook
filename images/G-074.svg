<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Die Kraftkette im Smash: Eine Linie läuft vom Ballen des hinteren Fußes über Knie, Hüfte und Schulter zum Ellbogen, zum Handgelenk und in den Schläger. Hervorgehoben ist das Stück zwischen Hüfte und Schulter, der Rumpf: Er ist die Brücke, über die die Kraft der Beine in den Schlag kommt.">

  <path class="kontur" d="M88,118 L54,236"/>
  <path class="kontur" d="M168,118 L202,236"/>

  <!-- Schlagkappe oben: das kennzeichnende Teil, darum in der Hauptfarbe -->
  <path class="kappe" d="M88,118 L94,72 A34,26 0 0 1 162,72 L168,118 A40,13 0 0 1 88,118 Z"/>
  <path class="kappenlinie" d="M109,76 A21,10 0 0 1 147,76"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Feinte, image 2 : le même joueur, avec derrière lui, en pâle, la position d'armé de l'image 1. À l'impact, les hanches et les épaules tournent vers la cible, le poids passe vers l'avant, le tamis reste neutre. Ce n'est qu'au speeder que deux chemins se séparent : la frappe appuyée, trait plein, à plat et longue hors de l'image, et l'amorti, en pointillé, dans la même direction, qui perd tôt de la hauteur et ne tombe que loin devant. Un cercle marque le moment de la décision.">

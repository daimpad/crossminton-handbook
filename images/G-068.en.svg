<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Two handles in cross-section, seen from the end of the handle, with the hand as a band around them. On the left the handle is too thin: the same hand reaches so far round that the fingertips press into the heel of the hand. On the right it fits: about the width of an index finger stays free between the fingertips and the heel of the hand.">

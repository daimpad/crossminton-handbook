<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Serwis, obraz 2: ten sam widok w chwili uderzenia. Ciężar przeszedł na przednią stopę, tylna pięta się unosi, przednia część stopy zostaje na podłożu. Ramię uderzające przeszło od tyłu i dołu do przodu, rakieta jest skierowana ukośnie w dół, płaszczyzna lekko otwarta do przodu. Cały speeder jest poniżej przerywanej linii na wysokości dłoni uderzającej; tor lotu wznosi się płasko i długo poza obraz.">

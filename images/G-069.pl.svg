  <path class="s-schaft" stroke-width="4" d="M304,111.5L304,164"/>
  <rect class="s-rahmen" x="299.8" y="164" width="8.4" height="72" rx="2.5"/>
  <ellipse class="s-rahmen" cx="304" cy="71" rx="32.3" ry="40.5" stroke-width="2.4"/>
  <path class="s-saiten" d="M281,44.6L281,97.4M290.2,37L290.2,105M299.4,33.7L299.4,108.3M308.6,33.7L308.6,108.3M317.8,37L317.8,105M327,44.6L327,97.4M285.1,39.5L322.9,39.5M279.1,48.5L328.9,48.5M275.7,57.5L332.3,57.5M274.2,66.5L333.8,66.5M274.2,75.5L333.8,75.5M275.7,84.5L332.3,84.5M279.1,93.5L328.9,93.5M285.1,102.5L322.9,102.5"/>
  <path class="s-cmschaft" stroke-width="7" d="M190,143L190,179"/>

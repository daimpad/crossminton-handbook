  <path class="s-masz" d="M132,53L182,53M132,236L160,236"/>
  <path class="s-masz" d="M140,55L140,234" marker-start="url(#mp)" marker-end="url(#mp)"/>
  <text class="s-zahl" x="140" y="148.5">maks. 61 cm</text>
  <text class="s-teilw" x="190" y="95">główka</text>
  <text class="s-teilw" x="190" y="108">maks. 650 cm²</text>
  <text class="s-name" x="62" y="254">Badminton</text>
  <text class="s-name2" x="190" y="254">Crossminton</text>
  <text class="s-name" x="304" y="254">Squash</text>
  <text class="st" x="180" y="286">krótsza niż do squasha, mocniejsza</text>
</svg>

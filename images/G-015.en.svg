<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Taking the Speeder early: the player steps into the shot, racket-side foot forward, and hits compactly at the highest point, clearly in front of and above the body. The incoming flight path sinks from the top right through this early contact point and on to beside the hip, where a faint Speeder shows the late contact point; the stretch in between is the time the opponent loses. The Speeder goes back flat and forward.">

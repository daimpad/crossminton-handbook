<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Draußen spielen: Blick von schräg oben hinter einem Spieler entlang der Spielrichtung. Zwei Felder ohne Netz, dazwischen die lange Passierzone. Der Spieler im nahen Feld schaut zu einer Fahne, die hinter dem fernen Feld an einem Mast im Wind weht; im fernen Feld steht das Gegenüber. Am Himmel die Sonne und Windlinien, am Horizont Bäume.">

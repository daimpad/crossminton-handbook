<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Draußen spielen: ein Spieler auf einem Feld ohne Netz unter offenem Himmel mit einfachem Untergrund, entspannte, anpassungsfähige Haltung.">
  <style>
    .fig{fill:none;stroke:var(--tinte,#16202b);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
    .kopf{fill:var(--tinte,#16202b)}
    .schaft{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5;stroke-linecap:round}
    .kelle{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5}
    .sonne{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:3;stroke-linecap:round}
    .sonnef{fill:var(--primaer,#38a4f1)}
    .horizont{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.6}
    .wolke{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.4;stroke-linecap:round;opacity:.6}
    .st{fill:var(--tinte-3,#6b7686);font:600 12px/1 system-ui,sans-serif;text-anchor:middle}
  </style>
  <!-- Sonne oben rechts -->
  <circle class="sonnef" cx="248" cy="54" r="15"/>
  <g class="sonne">
    <line x1="248" y1="26" x2="248" y2="16"/>
    <line x1="248" y1="92" x2="248" y2="82"/>
    <line x1="220" y1="54" x2="210" y2="54"/>
    <line x1="286" y1="54" x2="276" y2="54"/>
    <line x1="228" y1="34" x2="221" y2="27"/>
    <line x1="268" y1="34" x2="275" y2="27"/>
    <line x1="228" y1="74" x2="221" y2="81"/>
    <line x1="268" y1="74" x2="275" y2="81"/>
  </g>
  <!-- Wolke -->
  <path class="wolke" d="M60,70 C 66,58 88,58 92,70"/>
  <!-- Spieler, entspannt -->
  <circle class="kopf" cx="140" cy="88" r="15"/>
  <path class="fig" d="M140,112 L140,168"/>
  <path class="fig" d="M140,124 L118,152"/>
  <path class="fig" d="M140,124 L162,150"/>
  <path class="fig" d="M140,168 L122,204 L118,238"/>
  <path class="fig" d="M140,168 L158,204 L162,238"/>
  <line class="schaft" x1="162" y1="150" x2="170" y2="170"/>
  <ellipse class="kelle" cx="174" cy="184" rx="9" ry="13"/>
  <!-- Untergrund / Horizont -->
  <line class="horizont" x1="40" y1="242" x2="260" y2="242"/>
  <text class="st" x="150" y="270">draußen spielen · offenes Feld</text>
</svg>

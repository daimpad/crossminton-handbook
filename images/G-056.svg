<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Sonne und Blendung: Ein Spieler mit Schildmütze bereitet einen Überkopfschlag vor. Rechts steht die Sonne, ein heller Keil zeigt die Blendung bis zu seinen Augen. Die Flugbahn des Speeders kommt von rechts, führt an der Sonne vorbei und ist dort nur blass zu sehen; danach ist der Speeder wieder klar gezeichnet. Der Spieler hat den Kopf gedreht und schaut über den Blendkeil hinweg zum Speeder.">

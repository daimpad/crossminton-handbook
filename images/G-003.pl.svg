<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Drive forhendowy: ciężar na przedniej stopie, tułów obrócony w kierunku uderzenia, zwarty, płaski punkt kontaktu wyraźnie przed ciałem.">
  <style>
    .fig{fill:none;stroke:var(--tinte,#16202b);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
    .kopf{fill:var(--tinte,#16202b)}
    .schaft{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5;stroke-linecap:round}
    .kelle{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5}
    .bahn{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
    .boden{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.6;stroke-dasharray:5 6}
    .mk{fill:var(--primaer,#38a4f1)}
    .st{fill:var(--tinte-3,#6b7686);font:600 12px/1 system-ui,sans-serif;text-anchor:middle}
  </style>
  <defs><marker id="m003" viewBox="0 0 10 10" markerWidth="7.5" markerHeight="7.5" refX="6.5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" class="mk"/></marker></defs>
  <circle class="kopf" cx="104" cy="94" r="14"/>
  <path class="fig" d="M104,108 L110,168"/>
  <!-- Schlagarm nach vorn, kompakter Treffpunkt -->
  <path class="fig" d="M106,118 L134,126 L166,132"/>
  <!-- freier Arm -->
  <path class="fig" d="M106,124 L88,148"/>
  <!-- Beine: Gewicht auf dem vorderen Fuß -->
  <path class="fig" d="M110,168 L136,200 L152,236"/>
  <path class="fig" d="M110,168 L92,204 L80,238"/>
  <!-- Schläger + flacher Treffpunkt -->
  <line class="schaft" x1="166" y1="132" x2="184" y2="130"/>
  <ellipse class="kelle" cx="194" cy="129" rx="10" ry="14" transform="rotate(84 194 129)"/>
  <!-- flache, direkte Flugbahn -->
  <path class="bahn" d="M206,128 L280,120" marker-end="url(#m003)"/>
  <line class="boden" x1="70" y1="242" x2="188" y2="242"/>
  <text class="st" x="150" y="270">płasko i bezpośrednio · przed ciałem</text>
</svg>

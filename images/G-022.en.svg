<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Consistency under pressure: a clean, balanced stroke with calm posture — steady base, quiet head, controlled follow-through, reliably repeatable.">
  <style>
    .fig{fill:none;stroke:var(--tinte,#16202b);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
    .kopf{fill:var(--tinte,#16202b)}
    .schaft{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5;stroke-linecap:round}
    .kelle{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5}
    .lot{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:2;stroke-dasharray:3 5;opacity:.7}
    .bahn{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
    .boden{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.6;stroke-dasharray:5 6}
    .mk{fill:var(--primaer,#38a4f1)}
    .st{fill:var(--tinte-3,#6b7686);font:600 12px/1 system-ui,sans-serif;text-anchor:middle}
  </style>
  <defs><marker id="m022" viewBox="0 0 10 10" markerWidth="7.5" markerHeight="7.5" refX="6.5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" class="mk"/></marker></defs>
  <circle class="kopf" cx="120" cy="92" r="14"/>
  <path class="fig" d="M120,106 L120,168"/>
  <!-- ausbalancierter Schlag vor dem Körper -->
  <path class="fig" d="M120,116 L146,124 L172,126"/>
  <path class="fig" d="M120,122 L100,146"/>
  <!-- stabile, symmetrische Basis -->
  <path class="fig" d="M120,168 L100,204 L92,240"/>
  <path class="fig" d="M120,168 L140,204 L148,240"/>
  <!-- Lot durch den Körperschwerpunkt (Balance) -->
  <line class="lot" x1="120" y1="70" x2="120" y2="244"/>
  <line class="schaft" x1="172" y1="126" x2="188" y2="124"/>
  <ellipse class="kelle" cx="198" cy="123" rx="10" ry="14" transform="rotate(84 198 123)"/>
  <path class="bahn" d="M210,122 L280,118" marker-end="url(#m022)"/>
  <line class="boden" x1="80" y1="244" x2="164" y2="244"/>
  <text class="st" x="150" y="272">calm and repeatable · under pressure</text>
</svg>

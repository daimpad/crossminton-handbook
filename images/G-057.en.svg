<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Wet conditions and a secure stance: a player with a widened, cautious stance on damp ground, suggested water droplets and a low, secure centre of gravity.">
  <style>
    .fig{fill:none;stroke:var(--tinte,#16202b);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
    .kopf{fill:var(--tinte,#16202b)}
    .schaft{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5;stroke-linecap:round}
    .kelle{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:5.5}
    .schwer{fill:var(--primaer,#38a4f1)}
    .breit{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:2.4;stroke-dasharray:3 5}
    .tropfen{fill:var(--tinte-3,#6b7686);opacity:.65}
    .boden{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.6;stroke-dasharray:5 6}
    .st{fill:var(--tinte-3,#6b7686);font:600 12px/1 system-ui,sans-serif;text-anchor:middle}
  </style>
  <circle class="kopf" cx="150" cy="72" r="15"/>
  <path class="fig" d="M150,96 L150,150"/>
  <path class="fig" d="M150,108 L124,124 L138,146"/>
  <path class="fig" d="M150,108 L176,124 L162,146"/>
  <!-- sehr breiter, tiefer Stand -->
  <path class="fig" d="M150,150 L108,184 L98,220"/>
  <path class="fig" d="M150,150 L192,184 L202,220"/>
  <line class="schaft" x1="150" y1="146" x2="150" y2="172"/>
  <ellipse class="kelle" cx="150" cy="186" rx="10" ry="14"/>
  <!-- tiefer Schwerpunkt -->
  <circle class="schwer" cx="150" cy="164" r="5"/>
  <line class="breit" x1="98" y1="230" x2="202" y2="230"/>
  <!-- Wassertropfen -->
  <path class="tropfen" d="M70,196 q -5,8 0,12 q 5,-4 0,-12 Z"/>
  <path class="tropfen" d="M232,182 q -5,8 0,12 q 5,-4 0,-12 Z"/>
  <path class="tropfen" d="M84,224 q -4,6 0,9 q 4,-3 0,-9 Z"/>
  <line class="boden" x1="60" y1="238" x2="240" y2="238"/>
  <text class="st" x="150" y="266">wet ground · a wide, secure stance</text>
</svg>

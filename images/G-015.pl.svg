<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" data-quelle="figuren" aria-label="Wczesne przyjmowanie speedera: gracz wchodzi w uderzenie, stopa po stronie rakiety z przodu, i uderza zwięźle w najwyższym punkcie, wyraźnie przed i nad ciałem. Nadlatujący tor opada z prawej góry przez ten wczesny punkt kontaktu aż tuż przed tułów, gdzie speeder w obrysie pokazuje późny punkt kontaktu; odcinek między nimi to czas, którego brakuje przeciwnikowi. Speeder wraca płasko do przodu.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Hitze: ein Spieler teilt sich bei Hitze die Kräfte ein, die Sonne hoch über dem Kopf, daneben ein Sonnenschirm für die Pausen im Schatten, ruhige, bedachte Haltung.">
  <style>
    .fig{fill:none;stroke:var(--tinte,#16202b);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
    .kopf{fill:var(--tinte,#16202b)}
    .sonne{fill:none;stroke:var(--primaer,#38a4f1);stroke-width:3.4;stroke-linecap:round}
    .sonnef{fill:var(--primaer,#38a4f1)}
    .s-schirm{fill:none;stroke:var(--tinte-3,#656f7e);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .s-schirmf{fill:var(--tinte-3,#656f7e);opacity:.18}
    .s-schatten{fill:var(--tinte-3,#656f7e);opacity:.28}
    .boden{fill:none;stroke:var(--tinte-3,#6b7686);stroke-width:2.6;stroke-dasharray:5 6}
    .st{fill:var(--tinte-3,#6b7686);font:600 12px/1 system-ui,sans-serif;text-anchor:middle}
  </style>
  <!-- Sonne hoch über dem Kopf -->
  <circle class="sonnef" cx="140" cy="42" r="18"/>
  <g class="sonne">
    <line x1="140" y1="8" x2="140" y2="16"/>
    <line x1="106" y1="42" x2="114" y2="42"/>
    <line x1="174" y1="42" x2="166" y2="42"/>
    <line x1="116" y1="18" x2="121" y2="24"/>
    <line x1="164" y1="18" x2="159" y2="24"/>
    <line x1="116" y1="66" x2="121" y2="60"/>
    <line x1="164" y1="66" x2="159" y2="60"/>
  </g>
  <!-- Spieler, ruhig -->
  <circle class="kopf" cx="130" cy="102" r="14"/>
  <path class="fig" d="M130,116 L130,172"/>
  <path class="fig" d="M130,128 L110,154"/>
  <path class="fig" d="M130,128 L150,154"/>
  <path class="fig" d="M130,172 L114,208 L108,242"/>
  <path class="fig" d="M130,172 L146,208 L152,242"/>
  <!-- Sonnenschirm daneben: Schatten für die Pausen -->
  <ellipse class="s-schatten" cx="222" cy="245" rx="36" ry="5"/>
  <path class="s-schirmf" d="M184,130 Q222,84 260,130 Q250,136 241,130 Q231,136 222,130 Q212,136 203,130 Q193,136 184,130 Z"/>
  <path class="s-schirm" d="M184,130 Q222,84 260,130 Q250,136 241,130 Q231,136 222,130 Q212,136 203,130 Q193,136 184,130 Z"/>
  <line class="s-schirm" x1="222" y1="100" x2="222" y2="94"/>
  <line class="s-schirm" x1="222" y1="130" x2="222" y2="244"/>
  <line class="boden" x1="90" y1="246" x2="250" y2="246"/>
  <text class="st" x="150" y="274">Hitze · Schatten, Kräfte einteilen</text>
</svg>
